<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>


    <div class="container">
        <h1 class="text-center bg-success p-3 mt-2 text-white">Welcome to My Restro</h1>
        <div class="row">
            <div class="col-md-9">
                <select class="form-select" aria-label="Default select example" id="cat">
                    <option selected>Open and select menu</option>
                    <option value="Breakfast">Breakfast</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Pasta">Pasta</option>
                    <option value="Seafood">Seafood</option>
                    <option value="Vegetarian">Vegetarian</option>
                    <option value="Starter">Starter</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-success w-100" onclick="fetchData()">Search</button>
            </div>
        </div>
        <div class="row mt-3" id="id1">
           
        </div>
    </div>
    <script>
        function addCart(){
            alert('Aukad me Reh bhosdike')
        }
        function fetchData(){
            let cat = document.getElementById('cat').value
            fetch(`https://www.themealdb.com/api/json/v1/1/filter.php?c=${cat}`)
            .then(res =>res.json())
            .then(data => {
                let arrdata = data.meals
                let ans = ``
                for(let i=0;i<arrdata.length;i++){
                    // ans+=`<img src=${arrdata[i].strMealThumb} width="200px" height="200px">`
                    ans+=`<div class="col-md-4">
                        <div class="card">
                            <img src=${arrdata[i].strMealThumb} class="card-img-top" alt="...">
                            <div class="card-body">
                                <h5 class="card-title">${arrdata[i].strMeal}</h5>
                                <button type="button" class="btn btn-warning" onclick="addCart()">Buy now</button>
                                
                            </div>
                            </div>
                        </div>
                        `
                }
                document.getElementById('id1').innerHTML = ans
            })
        }
        
    </script>
</body>
</html>
